name: Live Google Maps

on:
  push:
    branches:
      - develop
    paths:
      - "src/1_application/**"
      - "src/2_infrastructure/puppeteer/**"
      - "tests/integration/**"
      - ".github/workflows/**"
      - "jest.config.ts"
      - "package.json"
      - "yarn.lock"
      - "tsconfig.jest.json"
      - "tsconfig.electron-test.json"
  pull_request:
    branches:
      - develop
    paths:
      - "src/1_application/**"
      - "src/2_infrastructure/puppeteer/**"
      - "tests/integration/**"
      - ".github/workflows/**"
      - "jest.config.ts"
      - "package.json"
      - "yarn.lock"
      - "tsconfig.jest.json"
      - "tsconfig.electron-test.json"
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: read

concurrency:
  group: live-google-maps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-google-maps:
    name: Live Google Maps integration
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      CI: "true"
      NODE_ENV: test
      PUPPETEER_HEADLESS: "true"
      RUN_FULL_LIVE_GOOGLE_MAPS_TESTS: "1"
      TEST_GOOGLE_MAPS_SEARCH_KEYWORD: "starbucks washington dc"
      TEST_ACCEPT_LANGUAGE: "vi-VN,vi;q=0.9,en-US;q=0.8,en;q=0.7"
      TEST_ELECTRON_WINDOW_SHOW: "false"
      GOOGLE_MAPS_DEBUG_DIR: artifacts\\google-maps
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false

      - name: Enable Corepack
        shell: cmd
        run: corepack enable

      - name: Activate Yarn 4.12.0
        shell: cmd
        run: corepack prepare yarn@4.12.0 --activate

      - name: Verify Yarn version
        shell: cmd
        run: yarn --version

      - name: Install dependencies
        shell: cmd
        run: yarn install --immutable

      - name: Resolve browser executable
        shell: pwsh
        run: |
          $candidates = @(
            $env:PUPPETEER_EXECUTABLE_PATH,
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          ) | Where-Object { $_ -and (Test-Path $_) }

          if (-not $candidates -or $candidates.Count -eq 0) {
            throw "No supported browser executable found for Puppeteer integration tests."
          }

          "PUPPETEER_EXECUTABLE_PATH=$($candidates[0])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Electron integration runtime
        shell: cmd
        run: yarn build:test-main

      - name: Run live Google Maps integration tests
        shell: cmd
        run: yarn jest --selectProjects integration --runInBand --detectOpenHandles

      - name: Upload Google Maps debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-google-maps-debug-${{ github.run_id }}
          path: artifacts/google-maps
          if-no-files-found: ignore
